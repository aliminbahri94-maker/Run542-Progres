<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setoran Progres Lari — Marathon & 5K</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e;
    --warn:#f59e0b; --danger:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0f172a,#111c33 60%,#0b1220);
    color:var(--txt); min-height:100vh; padding:16px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  header h1{font-size:1.5rem;background:linear-gradient(90deg,#38bdf8,#a78bfa,#22c55e);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--muted);font-size:.85rem;margin-top:4px}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat .num{font-size:1.6rem;font-weight:700;color:var(--accent)}
  .stat .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  /* BAR */
  .progress-bar{background:var(--card);border-radius:99px;height:26px;overflow:hidden;border:1px solid var(--line);margin-bottom:22px;position:relative}
  .progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#38bdf8);width:0;transition:width .5s;border-radius:99px}
  .progress-bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:600}

  /* TABS */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);
    color:var(--muted);cursor:pointer;font-size:.8rem;transition:.2s}
  .tab.active{background:var(--accent);color:#0f172a;font-weight:700;border-color:var(--accent)}

  /* HARI */
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
  .day-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
    background:var(--card2);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:6px}
  .day-head h2{font-size:1rem;display:flex;align-items:center;gap:8px}
  .day-head .date{font-size:.75rem;color:var(--muted)}
  .badge{font-size:.65rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
  .badge.done{background:var(--ok);color:#052e16;font-weight:700}

  .sessions{padding:10px 14px 14px}
  .session{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;
    background:var(--card2);margin-top:8px;border:1px solid var(--line);transition:.2s}
  .session.done{border-color:var(--ok);background:#0f2a1c}
  .session.deleted{opacity:.45;border-style:dashed;border-color:var(--danger);background:#2a0f14}
  .session label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;flex:1}
  .session input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);margin-top:2px;flex-shrink:0;cursor:pointer}
  .session .info{flex:1}
  .session .waktu{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700}
  .session .tgl{font-size:.72rem;color:var(--muted);margin-top:2px}
  .session .nama{font-size:.9rem;margin-top:2px}
  .session .meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
  .session input[type=text]{background:#0b1220;border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:4px 8px;font-size:.75rem;width:120px}
  .session input[type=number]{background:#0b1220;border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:4px 8px;font-size:.75rem;width:70px}
  .session .meta span{font-size:.7rem;color:var(--muted)}

  /* TOMBOL HAPUS */
  .btn-del{background:transparent;border:1px solid var(--danger);color:var(--danger);
    border-radius:8px;padding:4px 10px;font-size:.72rem;cursor:pointer;transition:.2s;
    font-weight:600;flex-shrink:0;margin-top:2px}
  .btn-del:hover{background:var(--danger);color:#fff}
  .btn-undo{background:transparent;border:1px solid var(--ok);color:var(--ok);
    border-radius:8px;padding:4px 10px;font-size:.72rem;cursor:pointer;transition:.2s;
    font-weight:600;flex-shrink:0;margin-top:2px}
  .btn-undo:hover{background:var(--ok);color:#052e16}

  .footer{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}
  button.btn{padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:.85rem}
  .btn-export{background:var(--accent);color:#0f172a}
  .btn-reset{background:var(--danger);color:#fff}
  .btn:hover{opacity:.88}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--ok);color:#052e16;padding:10px 20px;border-radius:10px;font-weight:600;
    font-size:.85rem;transition:.3s;opacity:0;pointer-events:none;z-index:99}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.error{background:var(--danger);color:#fff}

  @media(max-width:600px){
    .session .meta input[type=text]{width:90px}
    header h1{font-size:1.2rem}
    .session{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🏃 Setoran Progres Lari</h1>
    <p>Program Latihan Persiapan Marathon & 5K</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="statDone">0</div><div class="lbl">Sesi Selesai</div></div>
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total Sesi</div></div>
    <div class="stat"><div class="num" id="statKm">0</div><div class="lbl">Total KM</div></div>
    <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">Hari Aktif</div></div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
    <span id="progressText">0%</span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="days"></div>

  <div class="footer">
    <button class="btn btn-export" onclick="exportData()">📥 Export Data (JSON)</button>
    <button class="btn btn-reset" onclick="resetData()">🔄 Reset Progres</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== DATA PROGRAM ====== */
const PROGRAM = {
  Senin:[
    {waktu:"Pagi", nama:"Strength Training", km:0},
    {waktu:"Sore", nama:"Easy Run", km:5}
  ],
  Selasa:[
    {waktu:"Pagi", nama:"Interval 200m x 5-10", km:5},
    {waktu:"Sore", nama:"Easy Run 5-10 km", km:7}
  ],
  Rabu:[
    {waktu:"Pagi", nama:"Easy Run 10-12 km", km:11},
    {waktu:"Sore", nama:"Renang", km:0}
  ],
  Kamis:[
    {waktu:"Pagi", nama:"Partlek 10-20 km / Tempo 5-10 km", km:10},
    {waktu:"Sore", nama:"Istirahat", km:0}
  ],
  Jumat:[
    {waktu:"Pagi", nama:"Easy Run 10-15 km", km:12},
    {waktu:"Sore", nama:"Strength Training", km:0}
  ],
  Sabtu:[
    {waktu:"Pagi", nama:"Sepeda 10-30 km", km:0},
    {waktu:"Sore", nama:"Istirahat / Easy Run 3-5 km", km:4}
  ],
  Minggu:[
    {waktu:"Pagi", nama:"Medium Run", km:15},
    {waktu:"Sore", nama:"Istirahat", km:0}
  ]
};

const HARI = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const STORAGE_KEY = "progres_lari_v2";

/* ====== HELPER TANGGAL ====== */
// Cari tanggal Senin pada minggu berjalan
function getMondayOfWeek(d = new Date()){
  const date = new Date(d);
  const day = date.getDay(); // 0=Min,1=Sen,...
  const diff = (day === 0 ? -6 : 1 - day); // geser ke Senin
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
// Tanggal untuk hari tertentu dalam minggu ini
function getDateForHari(hariName){
  const monday = getMondayOfWeek();
  const idx = HARI.indexOf(hariName);
  const target = new Date(monday);
  target.setDate(monday.getDate() + idx);
  return target;
}
// Format: "Sen, 27 Okt 2025"
function formatTanggal(d){
  const NAMA_HARI = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
  const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  return `${NAMA_HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
}
// ISO untuk menyimpan: "2025-10-27"
function isoDate(d){ return d.toISOString().slice(0,10); }

/* ====== STATE ====== */
let state = loadData();
let activeTab = "Semua";

function defaultState(){
  const s = {};
  HARI.forEach(h => {
    const tgl = isoDate(getDateForHari(h));
    s[h] = PROGRAM[h].map(() => ({
      done:false, catatan:"", km:0,
      deleted:false, tanggal: tgl
    }));
  });
  return s;
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // migrasi: pastikan setiap sesi punya field tanggal & deleted
      HARI.forEach(h=>{
        if(!parsed[h]) parsed[h] = [];
        PROGRAM[h].forEach((_,i)=>{
          if(!parsed[h][i]) parsed[h][i] = {done:false,catatan:"",km:0,deleted:false,tanggal:isoDate(getDateForHari(h))};
          if(parsed[h][i].deleted === undefined) parsed[h][i].deleted = false;
          if(!parsed[h][i].tanggal) parsed[h][i].tanggal = isoDate(getDateForHari(h));
        });
      });
      return parsed;
    }
  }catch(e){}
  return defaultState();
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ====== RENDER ====== */
function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = ["Semua",...HARI].map(t =>
    `<div class="tab ${t===activeTab?'active':''}" onclick="setTab('${t}')">${t}</div>`
  ).join("");
}
function setTab(t){ activeTab = t; render(); }

function render(){
  renderTabs();
  const container = document.getElementById("days");
  container.innerHTML = "";

  const list = activeTab === "Semua" ? HARI : [activeTab];

  list.forEach(hari => {
    const idx = HARI.indexOf(hari);
    const dayData = state[hari];
    const aktif = dayData.filter(s=>!s.deleted);
    const doneCount = aktif.filter(s=>s.done).length;
    const allDone = aktif.length > 0 && doneCount === aktif.length;

    // Tanggal header (dari sesi pertama yang tidak dihapus, atau default)
    const tglHari = getDateForHari(hari);

    const dayEl = document.createElement("div");
    dayEl.className = "day";
    dayEl.innerHTML = `
      <div class="day-head">
        <h2>📅 ${hari} <span class="badge ${allDone?'done':''}">${doneCount}/${aktif.length} sesi</span></h2>
        <span class="date">${formatTanggal(tglHari)}</span>
      </div>
      <div class="sessions" id="sess-${idx}"></div>
    `;
    container.appendChild(dayEl);

    const sessEl = dayEl.querySelector(`#sess-${idx}`);

    PROGRAM[hari].forEach((p,i) => {
      const st = dayData[i];
      if(!st) return;

      const div = document.createElement("div");
      div.className = "session" +
        (st.done ? " done":"") +
        (st.deleted ? " deleted":"");

      const tglSesi = st.tanggal ? new Date(st.tanggal+"T00:00:00") : tglHari;

      div.innerHTML = `
        <label>
          <input type="checkbox" ${st.done?'checked':''} ${st.deleted?'disabled':''}
                 onchange="toggle('${hari}',${i},this.checked)">
          <div class="info">
            <div class="waktu">${p.waktu}</div>
            <div class="tgl">🗓️ ${formatTanggal(tglSesi)}</div>
            <div class="nama">${p.nama}</div>
          </div>
        </label>
        <div class="meta">
          <input type="number" min="0" step="0.1" placeholder="km" value="${st.km||''}"
                 ${st.deleted?'disabled':''}
                 onchange="setKm('${hari}',${i},this.value)" title="Jarak aktual (km)">
          <input type="text" placeholder="catatan..." value="${escapeAttr(st.catatan)}"
                 ${st.deleted?'disabled':''}
                 onchange="setNote('${hari}',${i},this.value)" maxlength="60">
          ${st.deleted
            ? `<button class="btn-undo" onclick="undoDelete('${hari}',${i})">↩️ Pulihkan</button>`
            : `<button class="btn-del" onclick="hapusSesi('${hari}',${i})" title="Hapus sesi ini">🗑️ Hapus</button>`
          }
        </div>
      `;
      sessEl.appendChild(div);
    });
  });

  updateStats();
}
function escapeAttr(s){ return (s||"").replace(/"/g,'&quot;'); }

/* ====== ACTIONS ====== */
function toggle(hari,i,val){
  if(state[hari][i].deleted) return;
  state[hari][i].done = val;
  saveData(); render();
  if(val) toast("✅ Sesi selesai dicatat!");
}
function setKm(hari,i,val){
  state[hari][i].km = parseFloat(val)||0;
  saveData(); updateStats();
}
function setNote(hari,i,val){
  state[hari][i].catatan = val;
  saveData();
}

/* ====== HAPUS (soft delete) ====== */
function hapusSesi(hari,i){
  const p = PROGRAM[hari][i];
  if(!confirm(`Hapus sesi "${p.waktu} - ${p.nama}"?\n\nData akan ditandai terhapus (bisa dipulihkan).`)) return;
  state[hari][i].deleted = true;
  state[hari][i].done = false;
  saveData(); render();
  toast("🗑️ Sesi dihapus. Klik 'Pulihkan' jika salah.", true);
}
function undoDelete(hari,i){
  state[hari][i].deleted = false;
  saveData(); render();
  toast("↩️ Sesi dipulihkan");
}

/* ====== STATS ====== */
function updateStats(){
  let done=0, total=0, km=0, activeDays=0;
  HARI.forEach(h=>{
    let dayDone=false;
    PROGRAM[h].forEach((p,i)=>{
      const st = state[h][i];
      if(!st || st.deleted) return; // sesi terhapus tidak dihitung
      total++;
      if(st.done){ done++; dayDone=true; km += (st.km || p.km || 0); }
    });
    if(dayDone) activeDays++;
  });
  document.getElementById("statDone").textContent = done;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKm").textContent = km.toFixed(1);
  document.getElementById("statStreak").textContent = activeDays;

  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("progressText").textContent = pct+"% selesai";
}

/* ====== EXPORT / RESET ====== */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `progres-lari-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast("📥 Data diexport!");
}
function resetData(){
  if(confirm("Yakin reset semua progres? Data tidak bisa dikembalikan.")){
    state = defaultState(); saveData(); render();
    toast("🔄 Progres direset");
  }
}
function toast(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove("show"),2400);
}

/* ====== INIT ====== */
render();
</script>
</body>
</html>
