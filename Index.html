  <script>
    const $ = id => document.getElementById(id);
    let backendRecords = [];
    let loaded = false;
    let loadTimer;

    const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const handler = {
      onDataChanged(data) {
        clearTimeout(loadTimer);
        loaded = true;
        backendRecords = data;
        $('load-state').classList.add('hidden');
        $('retry-button').classList.add('hidden');
        render();
      }
    };
    function message(text, error = false) {
      $('form-status').textContent = text;
      $('form-status').className = error ? 'text-sm text-[#ad4030]' : 'text-sm text-[#287047]';
    }
    function failLoad(text) {
      if (loaded) return;
      $('load-state').textContent = text;
      $('load-state').classList.remove('hidden');
      $('retry-button').classList.remove('hidden');
    }
    async function initialize() {
      loaded = false;
      $('retry-button').classList.add('hidden');
      $('load-state').textContent = 'Memuat setoran…';
      $('load-state').classList.remove('hidden');
      clearTimeout(loadTimer);
      loadTimer = setTimeout(() => failLoad('Setoran belum dapat dimuat. Coba lagi.'), 8000);
      try {
        const result = await window.dataSdk.init(handler);
        if (!result.isOk) {
          clearTimeout(loadTimer);
          failLoad('Tidak dapat menghubungkan Canva Sheet. Coba lagi.');
        }
      } catch (_) {
        clearTimeout(loadTimer);
        failLoad('Tidak dapat menghubungkan Canva Sheet. Coba lagi.');
      }
    }

      $('total').textContent = String(backendRecords.length);
      const now = new Date();
      const weekStart = new Date(now);
      const mondayOffset = (now.getDay() + 6) % 7;

      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 7);
      const weeklyDistance = backendRecords.reduce((sum, record) => {
        const date = new Date(`${record.tanggal || ''}T12:00:00`);
        return date >= weekStart && date < weekEnd ? sum + Number(record.jarak_km || 0) : sum;
      }, 0);
      $('weekly-total').textContent = `${weeklyDistance.toLocaleString('id-ID')} km`;
      $('empty-state').classList.toggle('hidden', backendRecords.length !== 0);
      $('limit-state').classList.toggle('hidden', backendRecords.length < 950);
      const sorted = [...backendRecords].sort((a,b) => String(b.tanggal || '').localeCompare(String(a.tanggal || '')) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
      const ids = new Set(sorted.map(record => String(record.__backendId)));
      for (const [id, row] of rows) {
        if (!ids.has(id)) { row.remove(); rows.delete(id); }
      }
      sorted.forEach((record, index) => {
        const id = String(record.__backendId);
        let row = rows.get(id);
        if (!row) {
          row = $('record-template').content.firstElementChild.cloneNode(true);
          row.dataset.recordId = id;
          rows.set(id, row);
          row.querySelector('[data-template-id="delete-button"]').addEventListener('click', () => row.querySelector('.confirm-area').classList.remove('hidden'));
          row.querySelector('[data-template-id="cancel-delete"]').addEventListener('click', () => row.querySelector('.confirm-area').classList.add('hidden'));
          row.querySelector('[data-template-id="confirm-delete"]').addEventListener('click', event => removeRecord(event, row));
        }
        const date = /^\d{4}-\d{2}-\d{2}$/.test(record.tanggal || '') ? new Date(record.tanggal + 'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}) : (record.tanggal || 'Tanpa tanggal');
        row.querySelector('[data-template-id="record-meta"]').textContent = `${record.hari || ''} · ${record.sesi || ''} · ${date}`;
        row.querySelector('[data-template-id="record-workout"]').textContent = record.latihan || 'Latihan';
        row.querySelector('[data-template-id="record-metrics"]').textContent = `${Number(record.jarak_km || 0).toLocaleString('id-ID')} km · ${Number(record.durasi_menit || 0).toLocaleString('id-ID')} menit`;
        const notes = row.querySelector('[data-template-id="record-notes"]');
        notes.textContent = record.catatan || '';
        notes.classList.toggle('hidden', !record.catatan);
        const current = $('history-list').children[index];
        if (current !== row) $('history-list').insertBefore(row, current || null);
      });
    }
    async function removeRecord(event, row) {
      const button = event.currentTarget;
      const record = backendRecords.find(item => String(item.__backendId) === row.dataset.recordId);
      if (!record) { message('Setoran ini sudah tidak tersedia.', true); return; }
      button.disabled = true;
      try {
        const result = await window.dataSdk.delete(record);
        if (!result.isOk) {
          message('Penghapusan belum dapat dikonfirmasi. Perbarui halaman sebelum mencoba lagi.', true);
        } else {
          row.remove();
          rows.delete(String(record.__backendId));
          message('Setoran berhasil dihapus.');
        }
      } catch (_) {
        message('Penghapusan belum dapat dikonfirmasi. Perbarui halaman sebelum mencoba lagi.', true);
      } finally {
        button.disabled = false;
      }
    }
    document.querySelectorAll('.session').forEach(button => button.addEventListener('click', () => {
      $('hari').value = button.dataset.day;
      $('sesi').value = button.dataset.session;
      $('latihan').value = button.dataset.workout;
      $('entry-section').scrollIntoView({behavior:'smooth',block:'start'});
      $('latihan').focus({preventScroll:true});
    }));
    $('retry-button').addEventListener('click', initialize);
    $('entry-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = event.submitter || $('save-button');
      if (!loaded) { message('Tunggu hingga setoran selesai dimuat.', true); return; }
      if (backendRecords.length >= 999) { $('limit-state').classList.remove('hidden'); message('Batas 999 setoran tercapai.', true); return; }
      if (!$('entry-form').reportValidity()) return;
      const record = {
        tanggal: $('tanggal').value,
        hari: $('hari').value,
        sesi: $('sesi').value,
        latihan: $('latihan').value.trim(),
        jarak_km: Number($('jarak').value),
        durasi_menit: Number($('durasi').value),
        catatan: $('catatan').value.trim(),
        created_at: new Date().toISOString()
      };
      if (!record.latihan) { message('Isi nama latihan terlebih dahulu.', true); $('latihan').focus(); return; }
      button.disabled = true;
      message('Menyimpan…');
      try {
        const result = await window.dataSdk.create(record);
        if (!result.isOk) {
          message('Penyimpanan belum dapat dikonfirmasi. Perbarui halaman sebelum mencoba lagi.', true);
        } else {
          message('Setoran berhasil disimpan.');
          $('jarak').value = '0';
          $('durasi').value = '0';
          $('catatan').value = '';
        }
      } catch (_) {
        message('Penyimpanan belum dapat dikonfirmasi. Perbarui halaman sebelum mencoba lagi.', true);
      } finally {
        button.disabled = false;
      }
    });
    const now = new Date();
    $('tanggal').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    $('hari').value = days[now.getDay()];
    initialize();
  </script>
 </body>
</html>
